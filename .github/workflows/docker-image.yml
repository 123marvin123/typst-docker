name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64/v8

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: 123marvin123/typst
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and load (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            TYPST_VERSION=${{ github.ref_name }}
          load: true
          tags: test-typst:latest
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Test image
        run: |
          echo "Hello World!" > test.typ
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/work test-typst:latest typst compile test.typ
          ls -l test.pdf
          docker run --rm test-typst:latest typst --version

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            TYPST_VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=multi-arch
          cache-to: type=gha,scope=multi-arch,mode=max