name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64/v8

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: test-typst:latest

      - name: Test image
        run: |
          echo "Hello World!" > test.typ
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/work test-typst:latest typst compile test.typ
          ls -l test.pdf
          docker run --rm test-typst:latest typst --version

      - name: Build (multi-arch, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8
          push: false